name: Agent and Documentation Contracts

on:
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - ".agents/**"
      - ".codex/**"
      - ".claude/skills/**"
      - "docs/**"
      - "Makefile"
      - ".gitignore"
      - "scripts/agent/**"
      - ".github/workflows/agent-contract.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - ".agents/**"
      - ".codex/**"
      - ".claude/skills/**"
      - "docs/**"
      - "Makefile"
      - ".gitignore"
      - "scripts/agent/**"
      - ".github/workflows/agent-contract.yml"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate contracts and adversarial fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository agent contracts
        run: python3 scripts/agent/doctor.py --root .

      - name: Test contract validator fixtures
        run: python3 -m unittest discover -s scripts/agent -p 'test_*.py'
