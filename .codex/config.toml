#:schema https://developers.openai.com/codex/config-schema.json

# Trusted-repository defaults. Live session policy can narrow these settings.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 6
interrupt_message = true

# Project-scoped custom agents are discovered from .codex/agents/*.toml.
# External MCP servers are intentionally not auto-started by repository config.
